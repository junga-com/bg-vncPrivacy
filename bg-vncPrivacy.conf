# bg-vncPrivacy settings. Find values with:
#   ddcutil detect                          (serial number)
#   ddcutil --sn SERIAL capabilities        (Feature 60: input source values)
#   ddcutil --sn SERIAL getvcp 60           (the input in use now)

[monitor]
# Serial number of the monitor to switch (empty: first monitor ddcutil finds).
serial = GTG7GJ4
# Input that shows this computer (Dell U4025QW USB-C/Thunderbolt).
desk_input = 0x19
# Unused input to switch to while privacy is on (HDMI-1, nothing connected).
private_input = 0x11

[vnc]
# Port x11vnc listens on; used to double-check that clients really left.
port = 5900
